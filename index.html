<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pultok - Video Paylaş və Qazan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { margin: 0; background: #000; color: #fff; display: flex; justify-content: center; min-height: 100vh; }
        
        .container { width: 100%; max-width: 450px; margin: auto; height: 100vh; position: relative; overflow: hidden; border-left: 1px solid #1f2937; border-right: 1px solid #1f2937; background: #000; display: flex; flex-direction: column; }
        
        /* GİRİŞ SƏHİFƏSİ UI */
        .login-view { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: center; padding: 30px; z-index: 100; }
        .logo-box { text-align: center; margin-bottom: 25px; display: flex; flex-direction: column; align-items: center; }
        .pultok-icon { width: 80px; height: 80px; background: linear-gradient(135deg, #00d2ff, #0066ff); border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 38px; color: #fff; box-shadow: 0 0 25px rgba(0, 210, 255, 0.5); margin-bottom: 15px; }
        .login-view h1 { text-align: center; color: #22d3ee; font-weight: 900; letter-spacing: 2px; font-size: 32px; }
        .auth-subtitle { text-align: center; color: #a1a1aa; font-size: 13px; margin-bottom: 30px; }
        
        /* SOSİAL GİRİŞ DÜYMƏLƏRİ */
        .social-btn { width: 100%; padding: 14px; margin: 8px 0; border: none; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; transition: opacity 0.2s; }
        .social-btn:opacity { opacity: 0.9; }
        .btn-google { background: #fff; color: #000; }
        .btn-tiktok { background: #010101; color: #fff; border: 1px solid #333; }
        .btn-instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); color: #fff; }
        .btn-facebook { background: #1877f2; color: #fff; }

        /* ƏSAS PROQRAM SAHƏSİ */
        .app-view { display: none; flex: 1; flex-direction: column; height: 100%; position: relative; }
        .content-area { flex: 1; position: relative; height: calc(100vh - 75px); overflow: hidden; }
        
        /* SƏHİFƏLƏR */
        .feed-page { width: 100%; height: 100%; position: relative; display: block; }
        .sub-page { position: absolute; inset: 0; background: #000; padding: 20px; display: none; flex-direction: column; overflow-y: auto; z-index: 50; }
        .sub-page.active { display: flex; }
        
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 5; }
        
        /* SIDEBAR (TİKTOK STYLE) */
        .sidebar { position: absolute; right: 15px; bottom: 100px; display: flex; flex-direction: column; gap: 20px; z-index: 25; }
        .side-btn { background: rgba(0,0,0,.6); color: #fff; border: 1px solid #333; border-radius: 50%; width: 50px; height: 50px; font-size: 20px; cursor: pointer; backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; }
        
        .video-info { position: absolute; bottom: 90px; left: 15px; z-index: 25; text-shadow: 1px 1px 4px #000; max-width: 75%; }
        .video-info h3 { color: #22d3ee; margin-bottom: 4px; font-size: 16px; }
        .video-info p { font-size: 13px; color: #e5e7eb; line-height: 1.4; }

        /* BALANS CARD PANELİ */
        .wallet-bar { position: absolute; bottom: 12px; left: 12px; right: 12px; background: rgba(17, 17, 17, 0.95); padding: 12px 15px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; z-index: 25; border: 1px solid #222; backdrop-filter: blur(8px); }
        .wallet-bar h2 { color: #34d399; font-size: 20px; }
        .wallet-bar button { background: #10b981; color: black; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }

        /* FIXED ALT NAVBAR (TAB BAR BUTTONS) */
        .bottom-nav-bar { height: 75px; border-top: 1px solid #1f2937; display: flex; justify-content: space-around; align-items: center; background: #000; z-index: 60; position: relative; }
        .nav-tab-item { background: none; border: none; color: #71717a; text-align: center; cursor: pointer; font-size: 20px; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; transition: color 0.2s; }
        .nav-tab-item.active-tab { color: #ffffff; }
        .nav-tab-item span { font-size: 10px; display: block; margin-top: 4px; font-weight: 500; }
        .plus-icon-btn { background: #fff; color: #000; font-weight: 900; padding: 3px 12px; border-radius: 8px; font-size: 14px; margin-top: 2px; }

        /* DETAL SƏHİFƏ DIZAYNLARI */
        .page-title { font-size: 22px; font-weight: bold; margin-bottom: 25px; text-align: center; color: #22d3ee; border-bottom: 1px solid #111; padding-bottom: 10px; }
        .profile-card { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 25px; background: #111; padding: 20px; border-radius: 16px; border: 1px solid #222; }
        .profile-img { width: 75px; height: 75px; background: #222; border-radius: 50%; border: 2px solid #22d3ee; display: flex; align-items: center; justify-content: center; font-size: 35px; }
        .stats-box { display: flex; justify-content: center; gap: 40px; margin-bottom: 25px; text-align: center; }
        .stats-box b { font-size: 18px; color: #fff; display: block; }
        .stats-box span { font-size: 11px; color: #a1a1aa; }
        
        .action-ui-btn { width: 100%; padding: 14px; background: #22d3ee; border: none; color: #000; font-weight: bold; border-radius: 10px; cursor: pointer; font-size: 14px; text-align: center; margin-top: 10px; }
        .upload-dashed-box { border: 2px dashed #3f3f46; border-radius: 16px; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; cursor: pointer; background: #111; text-align: center; margin-bottom: 15px; }
        .input-text-field { width: 100%; background: #111; border: 1px solid #222; border-radius: 10px; padding: 12px; color: white; font-size: 13px; margin-bottom: 12px; outline: none; }
        
        /* CANLI YAYIM (LIVE) INTERFEYS */
        .live-stream-container { background: #111; border-radius: 16px; border: 1px solid #ef4444; padding: 25px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .live-pulse-dot { width: 15px; height: 15px; background: #ef4444; border-radius: 50%; animation: livePulse 1.5s infinite; }
        @keyframes livePulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.4; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 0. SOSİAL GİRİŞ PANELİ -->
        <div class="login" id="loginPage">
            <div class="logo-box">
                <div class="pultok-icon">🕹️</div>
                <h1>PULTOK</h1>
            </div>
            <div class="auth-subtitle">Davam etmək üçün sosial hesabınızla giriş edin:</div>

            <button class="social-btn btn-google" onclick="handleSocialLogin('Google', '👤')">
                Google ilə Giriş Et
            </button>
            <button class="social-btn btn-tiktok" onclick="handleSocialLogin('TikTok', '🎵')">
                TikTok ilə Giriş Et
            </button>
            <button class="social-btn btn-instagram" onclick="handleSocialLogin('Instagram', '📸')">
                Instagram ilə Giriş Et
            </button>
            <button class="social-btn btn-facebook" onclick="handleSocialLogin('Facebook', '🔷')">
                Facebook ilə Giriş Et
            </button>
        </div>

        <!-- 1. ƏSƏS UYGULAMA (GİRİŞDƏN SONRA AÇILAN HİSSƏ) -->
        <div class="app-view" id="mainAppStructure">
            
            <div class="content-area">
                
                <!-- ANA SƏHİFƏ: VİDEO FEED -->
                <div class="feed-page" id="view-home">
                    <video id="pultokVideo" loop muted playsinline onclick="controlPlayback()">
                        <source src="https://mixkit.co" type="video/mp4">
                    </video>

                    <div class="sidebar">
                        <button class="side-btn" id="heartBtn" onclick="toggleLike()">🤍</button>
                        <button class="side-btn" onclick="switchTab('profile')">👤</button>
                        <button class="side-btn" onclick="copyAppUrl()">🔁</button>
                    </div>

                    <div class="video-info">
                        <h3 id="videoUserLabel">@pultok_user</h3>
                        <p>Video izlə, bəyən və dərhal balansına gəlir əldə et! 🚀 #pultok #money</p>
                    </div>

                    <div class="wallet-bar">
                        <div>
                            <small style="color: #a1a1aa; font-size: 11px;">Cari Balansınız</small>
                            <h2 id="balanceText">0.00 ₼</h2>
                        </div>
                        <button onclick="requestPayout()">Çıxar</button>
                    </div>
                </div>

                <!-- PAYLAŞMAQ (UPLOAD) SƏHİFƏSİ -->
                <div class="sub-page" id="view-upload">
                    <div class="page-title">Yeni Video Paylaş</div>
                    <div class="upload-dashed-box" onclick="alert('Telefon yaddaşına keçid aktivləşdirilir...')">
                        <span style="font-size: 35px;">📁</span>
