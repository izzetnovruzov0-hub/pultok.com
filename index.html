<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pultok - Video Paylaş və Qazan</title>
    <style>
        /* CSS QORUYUCU DÜZƏLDİLDİ: Düymələrin donmasının qarşısını almaq üçün pointer-events silindi */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: Arial, sans-serif;
        }
        
        body {
            margin: 0;
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: auto;
            height: 100vh;
            position: relative;
            overflow: hidden;
            border-left: 1px solid #1f2937;
            border-right: 1px solid #1f2937;
            background: #000;
        }

        /* YENİ: SİMGE LOQO DIZAYNI VƏ ANİMASİYASI */
        .logo-box {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .pultok-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #22d3ee, #06b6d4);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #000;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.4);
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(34, 211, 238, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(34, 211, 238, 0.7); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(34, 211, 238, 0.4); }
        }

        .adsense-banner { background: #111; border: 1px dashed #eab308; padding: 8px; margin: 10px; border-radius: 12px; text-align: center; min-height: 50px; z-index: 50; position: absolute; top: 0; left: 0; right: 0; }
        .ads-label { font-size: 8px; color: #eab308; text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 2px; }
        .youtube-ad-box { width: 100%; height: 140px; background: #111; border-radius: 12px; overflow: hidden; margin-top: 15px; border: 1px solid #ef4444; }

        video {
            width: 100%;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        .sidebar {
            position: absolute;
            right: 15px;
            bottom: 140px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 30;
        }

        .btn {
            background: rgba(0,0,0,.6);
            color: #fff;
            border: 1px solid #333;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 40;
        }

        .info {
            position: absolute;
            bottom: 120px;
            left: 15px;
            z-index: 30;
            text-shadow: 1px 1px 4px #000;
        }
        .info h3 { color: #22d3ee; margin-bottom: 4px; }

        .wallet {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            background: rgba(17, 17, 17, 0.95);
            padding: 15px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 30;
            border: 1px solid #222;
            backdrop-filter: blur(8px);
        }
        
        .wallet button { background: #10b981; color: black; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; z-index: 40; }

        /* GİRİŞ EKRANI SENSORLARI DÜZƏLDİLDİ */
        .login {
            position: absolute;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 30px;
            z-index: 100;
        }
        .login h1 { text-align: center; color: #22d3ee; font-weight: 900; letter-spacing: 2px; font-size: 36px; }
        .auth-subtitle { text-align: center; color: #a1a1aa; font-size: 13px; margin-bottom: 25px; }
        
        input {
            padding: 14px;
            margin: 10px 0;
            background: #111;
            border: 1px solid #222;
            color: white;
            border-radius: 8px;
            outline: none;
            width: 100%;
            z-index: 110;
            position: relative;
        }
        input:focus { border-color: #22d3ee; }

        button.loginbtn {
            padding: 16px;
            background: #22d3ee;
            border: none;
            color: black;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            font-size: 15px;
            z-index: 110;
            position: relative;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(34, 211, 238, 0.2);
        }
        .auth-toggle { text-align: center; margin-top: 25px; font-size: 13px; color: #a1a1aa; z-index: 110; position: relative; }
        .auth-toggle span { color: #22d3ee; cursor: pointer; font-weight: bold; }

        .sub-page { position: absolute; inset: 0; background: #000; z-index: 80; display: none; padding: 20px; flex-direction: column; overflow-y: auto; }
        .sub-page.active { display: flex; }
        .page-title { font-size: 20px; font-weight: bold; margin-bottom: 20px; text-align: center; color: #22d3ee; }
        .profile-header { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 20px; }
        .profile-avatar { width: 70px; height: 70px; background: #222; border-radius: 50%; border: 2px solid #22d3ee; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        .stats-row { display: flex; justify-content: center; gap: 35px; margin-bottom: 20px; text-align: center; }
        .stat-box span { display: block; font-size: 11px; color: #a1a1aa; }
        
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .admin-card { background: #111; border: 1px solid #222; padding: 12px; border-radius: 10px; text-align: center; }
        .admin-card h5 { font-size: 11px; color: #a1a1aa; margin-bottom: 2px; }
        .admin-card p { font-size: 16px; font-weight: bold; color: #22d3ee; }
        .request-item { background: #111; border: 1px solid #222; padding: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    </style>
</head>

<body>

    <div class="container">
        
        <!-- 0. SƏHİFƏ: GİRİŞ PANELİ VƏ LOGO SİMGƏSİ -->
        <div class="login" id="loginPage">
            <div class="logo-box">
                <!-- Yeni Göy Rəngli Pult Simgəsi -->
                <div class="pultok-icon">📲</div>
                <h1>PULTOK</h1>
            </div>
            <div class="auth-subtitle" id="auth-title">Sistemə Giriş Edin</div>

            <input type="text" id="auth-username" placeholder="İstifadəçi adı...">
            <input type="password" id="auth-password" placeholder="Şifrə...">

            <button class="loginbtn" id="auth-submit-btn" onclick="handleAuth()">
                Giriş Və Ya Qeydiyyat
            </button>
            
            <div class="auth-toggle" id="auth-toggle-text">
                Hesabınız yoxdur? <span onclick="toggleAuthMode(true)">Qeydiyyatdan keç</span>
            </div>
        </div>

        <!-- 1. SƏHİFƏ: ƏSAS VİDEO REALS AXINI -->
        <div id="app" style="display:none; width:100%; height:100%;">
            
            <div class="adsense-banner">
                <span class="ads-label">Google Adsense Reklamı</span>
            </div>

            <video id="video" loop muted playsinline onclick="togglePlay()">
                <source src="https://mixkit.co" type="video/mp4">
            </video>

            <div class="sidebar">
                <button class="btn" id="likeBtn" onclick="like()">🤍</button>
                <button class="btn" onclick="navigateTo('profile')">👤</button>
                <button class="btn" onclick="shareLink()">🔁</button>
            </div>

            <div class="info">
                <h3>@pultok_official</h3>
                <p>Video paylaş və qazan! 🚀 #pultok</p>
            </div>

            <div class="wallet">
                <div>
                    <small style="color: #a1a1aa; font-size: 11px;">Sizin Balansınız</small>
                    <h2 id="balance" style="color: #34d399;">0.00 ₼</h2>
                </div>
                <button onclick="withdraw()">Çıxar</button>
            </div>
        </div>

        <!-- 2. SƏHİFƏ: PROFİL SƏHİFƏSİ -->
        <div id="sub-profile" class="sub-page">
            <div class="page-title">İstifadəçi Profili</div>
            <div class="profile-header">
                <div class="profile-avatar">👤</div>
                <div id="profile-display-username" style="font-weight: bold; font-size: 16px;">@user</div>
            </div>
            <div class="stats-row">
