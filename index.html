<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pultok - Video Paylaş və Qazan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { margin: 0; background: #000; color: #fff; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 450px; margin: auto; height: 100vh; position: relative; overflow: hidden; border-left: 1px solid #1f2937; border-right: 1px solid #1f2937; background: #000; }
        
        .logo-box { text-align: center; margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pultok-icon { width: 75px; height: 75px; background: linear-gradient(135deg, #00d2ff, #0066ff); border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 38px; color: #fff; box-shadow: 0 0 25px rgba(0, 210, 255, 0.5); margin-bottom: 15px; }

        /* SOSYAL MEDYA GİRİŞ DÜĞMELERİ */
        .social-btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }
        .btn-google { background: #fff; color: #000; }
        .btn-instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); color: #fff; }
        .btn-tiktok { background: #000; color: #fff; border: 1px solid #fff; }
        .btn-facebook { background: #1877f2; color: #fff; }
        .divider { text-align: center; margin: 15px 0; color: #555; font-size: 12px; font-weight: bold; }

        .login { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: center; padding: 30px; z-index: 100; }
        .auth-subtitle { text-align: center; color: #a1a1aa; font-size: 13px; margin-bottom: 20px; }
        input { padding: 14px; margin: 8px 0; background: #111; border: 1px solid #222; color: white; border-radius: 8px; outline: none; width: 100%; }
        .universal-touch-trigger { padding: 16px; background: #22d3ee; color: #000; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; width: 100%; text-align: center; box-shadow: 0 4px 12px rgba(34, 211, 238, 0.3); }

        /* UYGULAMA İÇİ */
        .main-app { width: 100%; height: 100%; display: none; position: relative; }
        video { width: 100%; height: 100vh; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 10; }
        .sidebar { position: absolute; right: 15px; bottom: 140px; display: flex; flex-direction: column; gap: 20px; z-index: 30; }
        .btn-circle { background: rgba(0,0,0,.6); color: #fff; border: 1px solid #333; border-radius: 50%; width: 50px; height: 50px; font-size: 20px; cursor: pointer; backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; }
        .info { position: absolute; bottom: 120px; left: 15px; z-index: 30; text-shadow: 1px 1px 4px #000; }
        .wallet { position: absolute; bottom: 15px; left: 15px; right: 15px; background: rgba(17, 17, 17, 0.95); padding: 15px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; z-index: 30; border: 1px solid #222; backdrop-filter: blur(8px); }
        .wallet button { background: #10b981; color: black; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- LOGIN GRISH PANEL -->
        <div class="login" id="loginPage">
            <div class="logo-box">
                <div class="pultok-icon">🕹️</div>
                <h1 style="color:#22d3ee; font-size:32px; font-weight:900;">PULTOK</h1>
            </div>
            <div class="auth-subtitle">Sistemə Sürətli Giriş</div>

            <!-- SOSYAL MEDYA BUTONLARI -->
            <div class="social-btn btn-google" onclick="socialLogin('Google')">🌐 Google ilə Giriş</div>
            <div class="social-btn btn-instagram" onclick="socialLogin('Instagram')">📸 Instagram ilə Giriş</div>
            <div class="social-btn btn-tiktok" onclick="socialLogin('TikTok')">🎵 TikTok ilə Giriş</div>
            <div class="social-btn btn-facebook" onclick="socialLogin('Facebook')">🔷 Facebook ilə Giriş</div>

            <div class="divider">VƏ YA İSTİFADƏÇİ ADI İLƏ GİRİŞ</div>

            <input type="text" id="auth-username" placeholder="İstifadəçi adı...">
            <input type="password" id="auth-password" placeholder="Şifrə...">

            <div class="universal-touch-trigger" onclick="handleAuth()">
                Sistemə Daxil Ol
            </div>
        </div>

        <!-- UYGULAMA EKRANI -->
        <div class="main-app" id="app">
            <video id="video" loop muted playsinline onclick="togglePlay()">
                <source src="https://mixkit.co" type="video/mp4">
            </video>

            <div class="sidebar">
                <button class="btn-circle" id="likeBtn" onclick="like()">🤍</button>
                <button class="btn-circle" onclick="alert('Tezliklə aktivləşəcək!')">💬</button>
                <button class="btn-circle" onclick="shareLink()">🔁</button>
            </div>

            <div class="info">
                <h3 id="profileName">@pultok_user</h3>
                <p>Video paylaş və qazan! 🚀</p>
            </div>

            <div class="wallet">
                <div>
                    <small style="color: #a1a1aa;">Balansınız</small>
                    <h2 id="balance" style="color: #34d399;">0.00 ₼</h2>
                </div>
                <button onclick="withdraw()">Çıxar</button>
            </div>
        </div>
    </div>

    <script>
        let liked = false; let balance = 0.00; let loggedInUser = "istifadəçi";

        // Sosyal Medya Giriş Fonksiyonu (Tarayıcı kilitlerini aşmak için doğrudan simülasyon)
        function socialLogin(platform) {
            loggedInUser = platform + "_User";
            alert(platform + " ilə uğurla giriş edildi!");
            loginSuccess();
        }

        function handleAuth() {
            const u = document.getElementById('auth-username').value.trim();
            loggedInUser = u ? u : "Pultok_Qonaq";
            loginSuccess();
        }

        function loginSuccess() {
            document.getElementById("loginPage").style.display = "none";
            document.getElementById("app").style.display = "block";
            document.getElementById('profileName').innerText = "@" + loggedInUser;
            document.getElementById("video").play().catch(()=>{});
        }

        function togglePlay() { const v = document.getElementById("video"); if(v.paused) v.play(); else v.pause(); }
        function shareLink() { navigator.clipboard.writeText(window.location.href); alert("Keçid kopyalandı!"); }
        function withdraw() { alert("Minimum çıxarış 10 ₼ təşkil edir. Balansınız: " + balance.toFixed(2) + " ₼"); }

        function like() {
            const lBtn = document.getElementById('likeBtn');
            if(!liked) {
                balance += 0.01; document.getElementById("balance").innerText = balance.toFixed(2) + " ₼";
                lBtn.innerText = "❤️"; liked = true;
            } else {
                balance -= 0.01; document.getElementById("balance").innerText = balance.toFixed(2) + " ₼";
                lBtn.innerText = "🤍"; liked = false;
            }
        }
    </script>
</body>
</html>
