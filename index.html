<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pultok - Video Paylaş və Qazan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { margin: 0; background: #000; color: #fff; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 450px; margin: auto; height: 100vh; position: relative; overflow: hidden; border-left: 1px solid #1f2937; border-right: 1px solid #1f2937; background: #000; }
        
        /* GÖY RƏNGLİ SMART PULTOK LOQOSU */
        .logo-box { text-align: center; margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pultok-icon { width: 75px; height: 75px; background: linear-gradient(135deg, #00d2ff, #0066ff); border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 35px; color: #fff; box-shadow: 0 0 25px rgba(0, 210, 255, 0.5); margin-bottom: 10px; }
        .login h1 { text-align: center; color: #22d3ee; font-weight: 900; letter-spacing: 2px; font-size: 32px; }
        .auth-subtitle { text-align: center; color: #a1a1aa; font-size: 13px; margin-bottom: 20px; }

        /* SOSİAL ŞƏBƏKƏ DÜYMƏLƏRİ */
        .social-box { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .social-btn { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: opacity 0.2s; }
        .btn-google { background: #fff; color: #000; }
        .btn-tiktok { background: #010101; color: #fff; border: 1px solid #333; }
        .btn-instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); color: #fff; }
        .btn-facebook { background: #1877f2; color: #fff; }
        
        .divider { display: flex; align-items: center; text-align: center; color: #4b5563; font-size: 12px; margin: 15px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #1f2937; }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }

        input { padding: 14px; margin: 8px 0; background: #111; border: 1px solid #222; color: white; border-radius: 8px; outline: none; width: 100%; }
        input:focus { border-color: #22d3ee; }
        
        .universal-touch-trigger { padding: 15px; background: #22d3ee; color: #000; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; width: 100%; font-size: 15px; text-align: center; display: block; box-shadow: 0 4px 12px rgba(34, 211, 238, 0.2); }
        .login { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: center; padding: 25px; z-index: 100; overflow-y: auto; }
        
        /* APP VİDEO FEED */
        video { width: 100%; height: 100vh; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 10; }
        .sidebar { position: absolute; right: 15px; bottom: 140px; display: flex; flex-direction: column; gap: 20px; z-index: 30; }
        .btn { background: rgba(0,0,0,.6); color: #fff; border: 1px solid #333; border-radius: 50%; width: 50px; height: 50px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 40; }
        .info { position: absolute; bottom: 120px; left: 15px; z-index: 30; text-shadow: 1px 1px 4px #000; }
        .info h3 { color: #22d3ee; margin-bottom: 4px; }
        .wallet { position: absolute; bottom: 15px; left: 15px; right: 15px; background: rgba(17, 17, 17, 0.95); padding: 15px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; z-index: 30; border: 1px solid #222; backdrop-filter: blur(8px); }
        .wallet button { background: #10b981; color: black; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; z-index: 40; }
        .sub-page { position: absolute; inset: 0; background: #000; z-index: 80; display: none; padding: 20px; flex-direction: column; overflow-y: auto; }
        .sub-page.active { display: flex; }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- GİRİŞ EKRENI: SOSİAL ŞƏBƏKƏLƏR ILƏ -->
        <div class="login" id="loginPage">
            <div class="logo-box">
                <div class="pultok-icon">📲</div>
                <h1>PULTOK</h1>
            </div>
            <div class="auth-subtitle">Sürətli Giriş Sistemi</div>

            <!-- SOSİAL GİRİŞ LOGİKLƏRİ -->
            <div class="social-box">
                <button class="social-btn btn-google" onclick="socialLogin('Google')">🌐 Google ilə daxil ol</button>
                <button class="social-btn btn-tiktok" onclick="socialLogin('TikTok')">🎵 TikTok ilə daxil ol</button>
                <button class="social-btn btn-instagram" onclick="socialLogin('Instagram')">📸 Instagram ilə daxil ol</button>
                <button class="social-btn btn-facebook" onclick="socialLogin('Facebook')">🔵 Facebook ilə daxil ol</button>
            </div>

            <div class="divider">və ya</div>

            <input type="text" id="auth-username" placeholder="İstifadəçi adı...">
            <input type="password" id="auth-password" placeholder="Şifrə...">

            <div class="universal-touch-trigger" onclick="handleAuth()">
                Klassik Giriş / Qeydiyyat
            </div>
        </div>

        <!-- VİDEO VƏ BALANS PANELİ -->
        <div id="app" style="display:none; width:100%; height:100%;">
            <video id="video" loop muted playsinline onclick="togglePlay()">
                <source src="https://mixkit.co" type="video/mp4">
            </video>

            <div class="sidebar">
                <button class="btn" id="likeBtn" onclick="like()">🤍</button>
                <button class="btn" onclick="navigateTo('profile')">👤</button>
                <button class="btn" onclick="shareLink()">🔁</button>
            </div>

            <div class="info">
                <h3 id="display-user">@pultok_official</h3>
                <p>Video paylaş və qazan! 🚀 #pultok</p>
            </div>

            <div class="wallet">
                <div>
                    <small style="color: #a1a1aa; font-size: 11px;">Sizin Balansınız</small>
                    <h2 id="balance" style="color: #34d399;">0.00 ₼</h2>
                </div>
                <button onclick="withdraw()">Çıxar</button>
            </div>
        </div>

        <!-- PROFİL -->
        <div id="sub-profile" class="sub-page">
            <div style="font-size: 20px; font-weight: bold; margin-bottom: 20px; text-align: center; color: #22d3ee;">İstifadəçi Profili</div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 20px;">
                <div style="width: 70px; height: 70px; background: #222; border-radius: 50%; border: 2px solid #22d3ee; display: flex; align-items: center; justify-content: center; font-size: 30px;">👤</div>
                <div id="profile-display-username" style="font-weight: bold; font-size: 16px;">@user</div>
            </div>
            <div class="universal-touch-trigger" style="background: #333; color: white;" onclick="closeSubPage()">⬅️ Geriyə Qayıt</div>
            <div class="universal-touch-trigger" style="background: #ef4444; color: white;" onclick="handleLogout()">🚪 Çıxış Et</div>
        </div>
    </div>

    <script>
        let liked = false; let balance = 0.00; let loggedInUser = "istifadəçi";

        function socialLogin(platform) {
            alert(platform + " Giriş pəncərəsi aktivləşdirilir... Uğurla daxil oldunuz!");
            loggedInUser = platform + "_İstifadəçisi";
            loginSuccess();
        }

        function handleAuth() {
            const u = document.getElementById('auth-username').value.trim();
            loggedInUser = u ? u : "Sınaq_İstifadəçisi";
            loginSuccess();
        }

        function loginSuccess() {
            document.getElementById("loginPage").style.display = "none";
            document.getElementById("app").style.display = "block";
            document.getElementById('display-user').innerText = "@" + loggedInUser;
            document.getElementById('profile-display-username').innerText = "@" + loggedInUser;
            document.getElementById("video").play().catch(()=>{});
        }

        function handleLogout() {
            closeSubPage(); document.getElementById("app").style.display = "none";
            document.getElementById("loginPage").style.display = "flex"; document.getElementById("video").pause();
        }

        function togglePlay() { const v = document.getElementById("video"); if(v.paused) v.play(); else v.pause(); }
        function like() {
            const lBtn = document.getElementById('likeBtn');
            if(!liked) { balance += 0.01; document.getElementById("balance").innerText = balance.toFixed(2) + " ₼"; lBtn.innerText = "❤️"; liked = true; } 
            else { balance -= 0.01; document.getElementById("balance").innerText = balance.toFixed(2) + " ₼"; lBtn.innerText = "🤍"; liked = false; }
        }
        function shareLink() { navigator.clipboard.writeText(window.location.href); alert("Keçid kopyalandı!"); }
        function withdraw() { alert("Minimum çıxarış 10 ₼ təşkil edir."); }
        function navigateTo(id) { closeSubPage(); document.getElementById('sub-' + id).classList.add('active'); document.getElementById("video").pause(); }
