<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pultok - Video Paylaş və Qazan</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: Arial, sans-serif;
        }
        
        body {
            margin: 0;
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: auto;
            height: 100vh;
            position: relative;
            overflow: hidden;
            border-left: 1px solid #1f2937;
            border-right: 1px solid #1f2937;
            background: #000;
        }

        /* ANIMASIYALI GÖY LOQO */
        .logo-box {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .pultok-icon {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #00d2ff, #0066ff);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            color: #fff;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.5);
            margin-bottom: 12px;
            animation: pulseEffect 2s infinite;
        }
        
        @keyframes pulseEffect {
            0% { transform: scale(1); box-shadow: 0 0 25px rgba(0, 210, 255, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(0, 210, 255, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 25px rgba(0, 210, 255, 0.5); }
        }

        video {
            width: 100%;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        .sidebar {
            position: absolute;
            right: 15px;
            bottom: 140px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 30;
        }

        .btn {
            background: rgba(0,0,0,.6);
            color: #fff;
            border: 1px solid #333;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 40;
        }

        .info {
            position: absolute;
            bottom: 120px;
            left: 15px;
            z-index: 30;
            text-shadow: 1px 1px 4px #000;
        }
        .info h3 { color: #22d3ee; margin-bottom: 4px; }

        .wallet {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            background: rgba(17, 17, 17, 0.95);
            padding: 15px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 30;
            border: 1px solid #222;
            backdrop-filter: blur(8px);
        }
        
        .wallet-trigger-btn { background: #10b981; color: black; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; z-index: 40; font-size: 13px; }

        /* GİRİŞ PANELİ */
        .login {
            position: absolute;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 25px;
            z-index: 100;
            overflow-y: auto;
        }
        
        .login h1 { text-align: center; color: #22d3ee; font-weight: 900; letter-spacing: 2px; font-size: 34px; margin-bottom: 3px; }
        .auth-subtitle { text-align: center; color: #a1a1aa; font-size: 13px; margin-bottom: 15px; }
        
        input {
            padding: 14px;
            margin: 6px 0;
            background: #111;
            border: 1px solid #222;
            color: white;
            border-radius: 8px;
            outline: none;
            width: 100%;
            z-index: 110;
        }

        .universal-touch-trigger {
            padding: 15px;
            background: #22d3ee;
            color: #000;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            font-size: 15px;
            z-index: 120;
            text-align: center;
            box-shadow: 0 4px 12px rgba(34, 211, 238, 0.3);
        }

        .divider {
            text-align: center;
            margin: 15px 0;
            font-size: 12px;
            color: #555;
            position: relative;
        }

        /* YENİ: SOSİAL ŞƏBƏKƏ DÜYMƏLƏRİ */
        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            z-index: 120;
        }

        .social-btn {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            border: 1px solid #222;
            transition: opacity 0.2s;
        }
        .social-btn:active { opacity: 0.7; }
        
        .btn-google { background: #fff; color: #000; border: none; }
        .btn-tiktok { background: #010101; border: 1px solid #333; }
        .btn-insta { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); border: none; }
        .btn-fb { background: #1877f2; border: none; }

        .auth-toggle { text-align: center; margin-top: 20px; font-size: 13px; color: #a1a1aa; z-index: 110; }
        .auth-toggle span { color: #22d3ee; cursor: pointer; font-weight: bold; padding: 5px; }

        .sub-page { position: absolute; inset: 0; background: #000; z-index: 80; display: none; padding: 20px; flex-direction: column; overflow-y: auto; }
        .sub-page.active { display: flex; }
        .page-title { font-size: 20px; font-weight: bold; margin-bottom: 20px; text-align: center; color: #22d3ee; }
        
        .profile-header { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 20px; }
        .profile-avatar { width: 70px; height: 70px; background: #222; border-radius: 50%; border: 2px solid #22d3ee; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        .stats-row { display: flex; justify-content: center; gap: 35px; margin-bottom: 20px; text-align: center; }
        .stat-box span { display: block; font-size: 11px; color: #a1a1aa; }
        
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .admin-card { background: #111; border: 1px solid #222; padding: 12px; border-radius: 10px; text-align: center; }
        .admin-card p { font-size: 16px; font-weight: bold; color: #22d3ee; }
    </style>
</head>

<body>

    <div class="container">
        
        <!-- GİRİŞ VƏ SOSİAL ŞƏBƏKƏ PANELİ -->
        <div class="login" id="loginPage">
            <div class="logo-box">
                <div class="pultok-icon">🕹️</div>
                <h1>PULTOK</h1>
            </div>
            <div class="auth-subtitle" id="auth-title">Sistemə Giriş Edin</div>

            <input type="text" id="auth-username" placeholder="İstifadəçi adı...">
            <input type="password" id="auth-password" placeholder="Şifrə...">

            <div class="universal-touch-trigger" id="auth-submit-btn" onclick="handleAuth()">
                Giriş və ya Qeydiyyat
            </div>

            <div class="divider">və ya sürətli qoşul</div>

            <!-- SÜRATLİ SOSİAL GİRİŞ DÜYMƏLƏRİ (Bütün Blokları Qırır) -->
            <div class="social-grid">
                <div class="social-btn btn-google" onclick="socialLogin('Google_User')">
                    🌐 Google
                </div>
                <div class="social-btn btn-tiktok" onclick="socialLogin('TikTok_User')">
                    🎵 TikTok
                </div>
                <div class="social-btn btn-insta" onclick="socialLogin('Insta_User')">
                    📸 Instagram
                </div>
                <div class="social-btn btn-fb" onclick="socialLogin('FB_User')">
                    🔵 Facebook
                </div>
            </div>
            
            <div class="auth-toggle" id="auth-toggle-text">
                Hesabınız yoxdur? <span onclick="toggleAuthMode(true)">Qeydiyyatdan keç</span>
            </div>
        </div>

        <!-- ƏSAS VİDEO TIKTOK FEED SƏHİFƏSİ -->
        <div id="app" style="display:none; width:100%; height:100%;">
            <video id="video" loop muted playsinline onclick="togglePlay()">
                <source src="https://mixkit.co" type="video/mp4">
            </video>

            <div class="sidebar">
                <button class="btn" id="likeBtn" onclick="like()">🤍</button>
                <button class="btn" onclick="navigateTo('profile')">👤</button>
                <button class="btn" onclick="shareLink()">🔁</button>
            </div>

            <div class="info">
                <h3>@pultok_official</h3>
                <p>Video paylaş və qazan! 🚀 #pultok</p>
            </div>

            <div class="wallet">
